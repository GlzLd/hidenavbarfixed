
name: Android Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NavHide APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. 配置 Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 4. 配置 Gradle 8.9
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 5. 创建项目需要的签名文件
      - name: Generate debug keystore
        run: |
          mkdir -p NavHideModule/keystore

          if [ ! -f NavHideModule/keystore/debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore NavHideModule/keystore/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 6. 编译 APK
      - name: Build Debug and Release APK
        run: |
          gradle -p NavHideModule \
            --no-daemon \
            assembleDebug \
            assembleRelease

      # 7. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavHide-APK-${{ github.run_number }}
          path: |
            NavHideModule/app/build/outputs/apk/debug/*.apk
            NavHideModule/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
