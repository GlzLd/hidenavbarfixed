
name: Android Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build NavHide APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Disable local proxy for CI
        run: |
          sed -i '/^systemProp\.socksProxyHost=/d' NavHideModule/gradle.properties
          sed -i '/^systemProp\.socksProxyPort=/d' NavHideModule/gradle.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
         
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate debug keystore
        run: |
          mkdir -p NavHideModule/keystore

          keytool -genkeypair \
            -v \
            -keystore NavHideModule/keystore/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug and Release APK
        run: |
          gradle -p NavHideModule \
            --no-daemon \
            assembleDebug \
            assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NavHide-APK-${{ github.run_number }}
          path: |
            NavHideModule/app/build/outputs/apk/debug/*.apk
            NavHideModule/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
